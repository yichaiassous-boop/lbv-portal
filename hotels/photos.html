<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>תמונות המקום · La Belle Vie</title>
<link rel="icon" type="image/png" href="../media/icon-gold.png">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  /* owner 25.11: the Google sheet links here instead of =IMAGE (which needed an approval and looked bad).
     The photos come in the link itself (?n=name&u=photo&u=photo); only https pictures are shown. */
  :root { --night: #0B1430; --gold: #E3B65C; --ink: #16203A; --ink-2: #4A5675; --line: #E3E8F0; --bg: #F4F6FA; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 "Assistant", sans-serif; }
  header { background: var(--night); color: #C7D3E4; padding: 26px 16px 20px; }
  .w { width: min(1100px, 100%); margin: 0 auto; padding-inline: 16px; }
  header small { color: var(--gold); letter-spacing: .04em; }
  h1 { margin: 4px 0 0; color: #fff; font: 700 1.7rem/1.25 "Frank Ruhl Libre", serif; }
  header p { margin: 6px 0 0; }
  main { padding-top: 18px; padding-bottom: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  main button { all: unset; cursor: zoom-in; display: block; border-radius: 10px; overflow: hidden; background: #DDE3EC; aspect-ratio: 4 / 3; }
  main button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  main img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  main button:hover img { transform: scale(1.03); }
  .empty { grid-column: 1 / -1; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; color: var(--ink-2); }
  .bad { display: none; }
  dialog { border: 0; padding: 0; margin: 0; background: transparent; max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh; overflow: hidden; }
  dialog::backdrop { background: rgba(6, 10, 24, .92); }
  .lb { position: relative; width: 100%; height: 100%; display: grid; place-items: center; padding: 56px 12px; }
  .lb img { max-width: calc(100vw - 24px); max-height: calc(100dvh - 112px); width: auto; height: auto; object-fit: contain; border-radius: 6px; }
  .lb button { position: absolute; border: 0; background: rgba(255,255,255,.12); color: #fff; font: 600 1rem "Assistant", sans-serif; border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .lb button:hover, .lb button:focus-visible { background: rgba(255,255,255,.24); outline: none; }
  .lb [data-x] { top: 12px; left: 12px; }
  .lb [data-prev] { right: 12px; top: 50%; transform: translateY(-50%); }
  .lb [data-next] { left: 12px; top: 50%; transform: translateY(-50%); }
  .lb .n { position: absolute; bottom: 16px; color: #C7D3E4; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { main img { transition: none; } }
  @media (max-width: 560px) { h1 { font-size: 1.4rem; } main { grid-template-columns: 1fr 1fr; gap: 6px; } }
</style>
</head>
<body>
<header><div class="w"><small>La Belle Vie</small><h1 id="t">תמונות המקום</h1><p id="c"></p></div></header>
<main class="w" id="g"></main>
<dialog id="d"><div class="lb"><button type="button" data-x>סגירה</button><button type="button" data-prev aria-label="התמונה הקודמת">&#8594;</button><img alt=""><button type="button" data-next aria-label="התמונה הבאה">&#8592;</button><span class="n"></span></div></dialog>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const name = (q.get('n') || '').slice(0, 120);
  const pics = [...new Set(q.getAll('u'))].filter(u => /^https:\/\/[^\s"<>]+$/i.test(u)).slice(0, 12);
  const g = document.getElementById('g'), d = document.getElementById('d'), big = d.querySelector('img'), num = d.querySelector('.n');
  if (name) { document.getElementById('t').textContent = name; document.title = name + ' · תמונות'; }
  document.getElementById('c').textContent = pics.length ? (pics.length === 1 ? 'תמונה אחת' : pics.length + ' תמונות') + '. לוחצים על תמונה כדי להגדיל.' : '';
  if (!pics.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'אין תמונות בקישור הזה.'; g.append(p); return; }
  let at = 0;
  const show = i => { at = (i + pics.length) % pics.length; big.src = pics[at]; big.alt = (name || 'המקום') + ', תמונה ' + (at + 1); num.textContent = (at + 1) + ' מתוך ' + pics.length; };
  pics.forEach((u, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'להגדיל תמונה ' + (i + 1));
    const im = document.createElement('img'); im.src = u; im.loading = 'lazy'; im.alt = (name || 'המקום') + ', תמונה ' + (i + 1);
    im.onerror = () => b.classList.add('bad');
    b.append(im); b.onclick = () => { show(i); d.showModal(); }; g.append(b);
  });
  d.querySelector('[data-x]').onclick = () => d.close();
  d.querySelector('[data-prev]').onclick = () => show(at - 1);
  d.querySelector('[data-next]').onclick = () => show(at + 1);
  d.addEventListener('click', e => { if (e.target === d || e.target.classList.contains('lb')) d.close(); });
  d.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(at - 1); if (e.key === 'ArrowLeft') show(at + 1); });
  if (pics.length < 2) d.querySelectorAll('[data-prev],[data-next]').forEach(b => b.hidden = true);
})();
</script>
</body>
</html>
