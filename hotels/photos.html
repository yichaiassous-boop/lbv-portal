<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B1430">
<title>תמונות המקום · La Belle Vie</title>
<link rel="icon" type="image/png" href="../media/icon-gold.png">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  /* owner 25.11: the photos of a place, from the link in the Google sheet. On the phone it works like the phone's photo album:
     a grid of small squares, a tap opens the photo full screen, a finger swipe moves to the next one, the phone's Back closes it. */
  :root { --night: #0B1430; --gold: #E3B65C; --ink: #16203A; --ink-2: #4A5675; --line: #E3E8F0; --bg: #F4F6FA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 16px/1.55 "Assistant", sans-serif; }
  body.open { overflow: hidden; }
  header { background: var(--night); color: #C7D3E4; padding: 22px 16px 18px; }
  .w { width: min(1100px, 100%); margin: 0 auto; }
  header .w { padding-inline: 0; }
  header small { color: var(--gold); letter-spacing: .04em; }
  h1 { margin: 2px 0 0; color: #fff; font: 700 1.6rem/1.25 "Frank Ruhl Libre", serif; }
  header p { margin: 4px 0 0; font-size: .95rem; }

  /* the album grid */
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px; padding: 4px 0 40px; }
  .tile { all: unset; cursor: pointer; display: block; aspect-ratio: 1; overflow: hidden; background: #DDE3EC; position: relative; -webkit-tap-highlight-color: transparent; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; }
  .tile img.in { opacity: 1; }
  .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
  .tile.bad { display: none; }
  .empty { grid-column: 1 / -1; margin: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; color: var(--ink-2); }
  @media (max-width: 640px) { main { grid-template-columns: repeat(3, 1fr); gap: 2px; padding-top: 2px; } h1 { font-size: 1.35rem; } }

  /* the viewer: full screen, one photo per screen, swiped with the finger */
  .v { position: fixed; inset: 0; z-index: 10; background: #000; display: none; }
  .v.on { display: block; }
  .track { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: center; }
  .slide img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .bar { position: absolute; top: 0; inset-inline: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
         padding: max(10px, env(safe-area-inset-top)) 12px 18px; background: linear-gradient(rgba(0,0,0,.65), transparent); color: #fff; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .bar .n { font-weight: 600; font-size: 1rem; }
  .btn { border: 0; background: rgba(255,255,255,.16); color: #fff; font: 600 1rem "Assistant", sans-serif; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .btn:hover, .btn:focus-visible { background: rgba(255,255,255,.3); outline: none; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; padding: 0; font-size: 1.4rem; }
  .arrow.prev { right: 14px; }
  .arrow.next { left: 14px; }
  @media (hover: none), (max-width: 640px) { .arrow { display: none; } }
</style>
</head>
<body>
<header><div class="w"><small>La Belle Vie</small><h1 id="t">תמונות המקום</h1><p id="c"></p></div></header>
<main class="w" id="g"></main>
<div class="v" id="v" role="dialog" aria-modal="true" aria-label="תמונה בגדול">
  <div class="track" id="k"></div>
  <div class="bar"><span class="n" id="n"></span><button type="button" class="btn" id="x">סגירה</button></div>
  <button type="button" class="btn arrow prev" id="pv" aria-label="התמונה הקודמת">&#8594;</button>
  <button type="button" class="btn arrow next" id="nx" aria-label="התמונה הבאה">&#8592;</button>
</div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  let name = (q.get('n') || '').slice(0, 120);
  let pics = [...new Set(q.getAll('u'))];
  // the short link from the sheet (?s=&h=&t=): the photos come from the site, the ones chosen in the card
  if (q.get('s') && q.get('h')) {
    $('c').textContent = 'טוען את התמונות...';
    try {
      const r = await fetch('/api/hotels?pics=' + encodeURIComponent(q.get('s')) + '&h=' + encodeURIComponent(q.get('h')) + '&t=' + encodeURIComponent(q.get('t') || ''));
      if (r.ok) { const j = await r.json(); name = String(j.name || '').slice(0, 120) + (j.city ? ', ' + String(j.city).slice(0, 60) : ''); pics = Array.isArray(j.photos) ? j.photos : []; }
    } catch (e) {}
  }
  pics = [...new Set(pics)].filter(u => /^https:\/\/[^\s"<>]+$/i.test(u)).slice(0, 24);
  const g = $('g'), v = $('v'), k = $('k');
  if (name) { $('t').textContent = name; document.title = name + ' · תמונות'; }
  $('c').textContent = pics.length ? (pics.length === 1 ? 'תמונה אחת' : pics.length + ' תמונות') + '. לוחצים על תמונה כדי לפתוח, ומחליקים לצדדים.' : '';
  if (!pics.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'אין תמונות בקישור הזה.'; g.append(p); return; }

  const alt = i => (name || 'המקום') + ', תמונה ' + (i + 1);
  const slides = pics.map((u, i) => {
    const s = document.createElement('div'); s.className = 'slide';
    const im = document.createElement('img'); im.alt = alt(i); im.decoding = 'async'; im.draggable = false;
    s.append(im); k.append(s); return s;
  });
  const small = (u, w) => '/_vercel/image?url=' + encodeURIComponent(u) + '&w=' + w + '&q=75';
  const load = i => { const im = slides[i] && slides[i].firstChild; if (im && !im.src) { im.onerror = () => { if (!im.dataset.full) { im.dataset.full = 1; im.src = pics[i]; } }; im.src = small(pics[i], 1080); } };

  pics.forEach((u, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.setAttribute('aria-label', 'לפתוח את ' + alt(i));
    // a small copy for the square (fast on the phone); if the small copy fails, the photo itself
    const im = document.createElement('img'); im.src = small(u, 384); im.loading = i < 12 ? 'eager' : 'lazy'; im.decoding = 'async'; im.alt = alt(i);
    im.onload = () => im.classList.add('in');
    im.onerror = () => { if (im.src !== u && !im.dataset.full) { im.dataset.full = 1; im.src = u; return; } b.classList.add('bad'); slides[i].style.display = 'none'; };
    b.append(im); b.onclick = () => open(i); g.append(b);
  });

  let at = 0;
  const mark = i => { at = i; $('n').textContent = (i + 1) + ' מתוך ' + pics.length; [i - 1, i, i + 1, i + 2].forEach(load); };
  // which photo is on screen: the slide nearest the middle
  // (right-to-left: the strip scrolls to negative numbers, so by the distance from the start)
  k.addEventListener('scroll', () => { if (!v.classList.contains('on')) return; const i = Math.round(Math.abs(k.scrollLeft) / (k.clientWidth || 1)); if (i !== at && slides[i]) mark(i); }, { passive: true });
  const go = i => { i = Math.max(0, Math.min(pics.length - 1, i)); load(i); slides[i].scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); };

  function open(i) {
    load(i); mark(i);
    v.classList.add('on'); document.body.classList.add('open');
    k.style.scrollSnapType = 'none';
    slides[i].scrollIntoView({ inline: 'center', block: 'nearest' });
    requestAnimationFrame(() => { k.style.scrollSnapType = ''; });
    history.pushState({ photo: true }, '');   // the phone's Back closes the photo, not the page
    $('x').focus({ preventScroll: true });
  }
  function shut() { v.classList.remove('on'); document.body.classList.remove('open'); g.children[at] && g.children[at].focus({ preventScroll: true }); }
  window.addEventListener('popstate', () => { if (v.classList.contains('on')) shut(); });
  $('x').onclick = () => { if (history.state && history.state.photo) history.back(); else shut(); };
  $('pv').onclick = () => go(at - 1);
  $('nx').onclick = () => go(at + 1);
  document.addEventListener('keydown', e => {
    if (!v.classList.contains('on')) return;
    if (e.key === 'Escape') $('x').click();
    if (e.key === 'ArrowRight') go(at - 1);
    if (e.key === 'ArrowLeft') go(at + 1);
  });
  if (pics.length < 2) { $('pv').hidden = true; $('nx').hidden = true; }
})();
</script>
</body>
</html>
