<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>סקר מלונות · La Belle Vie</title>
<link rel="icon" type="image/png" href="../media/icon-gold.png">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --night: #0B1430; --gold: #E3B65C; --ink: #16203A; --ink-2: #4A5675; --ink-3: #7A86A2; --line: #E3E8F0; --bg: #F4F6FA; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 "Assistant", sans-serif; }
  header { background: var(--night); color: #C7D3E4; padding: 28px 16px 22px; }
  header .w, main { width: min(1100px, 100%); margin: 0 auto; padding-inline: 16px; }
  h1 { margin: 0; color: #fff; font: 700 1.7rem/1.2 "Frank Ruhl Libre", serif; }
  header p { margin: 6px 0 0; }
  header small { color: var(--gold); letter-spacing: .05em; }
  main { padding-top: 20px; padding-bottom: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .ho { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; align-content: start; }
  .ho b.n { font: 700 1.12rem/1.3 "Frank Ruhl Libre", serif; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .sub { color: var(--ink-2); font-size: .9rem; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 800; white-space: nowrap; }
  .ok { background: #DCFCE7; color: #15803D; } .warn { background: #FEF3C7; color: #92400E; } .no { background: #FEE2E2; color: #B91C1C; } .gray { background: #EEF1F6; color: var(--ink-3); }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  li { padding: 4px 9px; border-radius: 8px; background: #FBF5E6; font-size: .9rem; }
  .sum { color: var(--ink-2); font-size: .9rem; margin: 0; }
  .msg { grid-column: 1 / -1; text-align: center; color: var(--ink-3); padding: 40px 0; }
</style>
</head>
<body>
<header><div class="w"><small>La Belle Vie · צפייה בלבד</small><h1 id="t">סקר מלונות</h1><p id="d"></p></div></header>
<main id="m"><p class="msg">טוען…</p></main>
<script>
(async () => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dmy = iso => (iso || '').slice(0, 10).split('-').reverse().join('.');
  const money = (n, c) => n == null ? '' : Number(n).toLocaleString('he-IL') + ' ' + ({ EUR: '€', USD: '$' }[c] || '₪');
  const AV = { unknown: ['לא ידוע', 'gray'], available: ['יש מקום', 'ok'], partial: ['מקום חלקי', 'warn'], full: ['תפוס', 'no'] };
  const p = new URLSearchParams(location.search), m = document.getElementById('m');
  try {
    const r = await fetch(`/api/hotels?view=${encodeURIComponent(p.get('id') || '')}&t=${encodeURIComponent(p.get('t') || '')}`, { cache: 'no-store' });
    if (!r.ok) throw 0;
    const { survey: s, hotels } = await r.json();
    document.getElementById('t').textContent = s.title;
    document.title = s.title + ' · La Belle Vie';
    document.getElementById('d').textContent = [s.from ? dmy(s.from) + (s.to && s.to !== s.from ? ' – ' + dmy(s.to) : '') : '', s.area, s.need].filter(Boolean).join(' · ');
    const order = ['available', 'partial', 'unknown', 'full'];
    const list = hotels.filter(h => h.status !== 'no').sort((a, b) => order.indexOf(a.avail) - order.indexOf(b.avail) || (a.min ?? 1e12) - (b.min ?? 1e12));
    m.innerHTML = list.length ? list.map(h => { const [an, ac] = AV[h.avail] || AV.unknown; return `<article class="ho">
      <div class="top"><b class="n">${esc(h.name)}</b><span class="pill ${ac}">${an}</span></div>
      <div class="sub">${esc([h.city, h.availText].filter(Boolean).join(' · '))}</div>
      ${(h.prices || []).length ? `<ul>${h.prices.map(x => `<li>${esc([x.level, x.board].filter(Boolean).join(' · ') || 'מחיר')}: <b>${money(x.price, x.currency)}</b> ${esc(x.per || '')}${x.note ? ' (' + esc(x.note) + ')' : ''}</li>`).join('')}</ul>` : ''}
      ${h.summary ? `<p class="sum">${esc(h.summary)}</p>` : ''}</article>`; }).join('') : '<p class="msg">עוד אין מלונות בסקר.</p>';
  } catch (e) { m.innerHTML = '<p class="msg">הקישור לא תקין או שהשיתוף כובה.</p>'; }
})();
</script>
</body>
</html>
