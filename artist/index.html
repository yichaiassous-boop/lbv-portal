<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="only light">
<title>הדף שלי – La Belle Vie</title>
<link rel="icon" type="image/png" href="/media/icon-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/events.css">
<link rel="stylesheet" href="/admin/artists.css">
<style>
  body { min-height: 100vh; }
  .av-wrap { width: min(1120px, 100%); margin: 0 auto; padding: 18px 16px 48px; }
  .av-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--ink-2); font-size: .88rem; }
  .av-top img { height: 34px; width: auto; filter: brightness(0); opacity: .85; }
  .av-msg { padding: 40px 20px; text-align: center; color: var(--ink-2); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .card__head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card__head h2 { font-size: 1.25rem; }
  .card__head p { margin: 2px 0 0; color: var(--ink-2); font-size: .88rem; }
  .av-login { max-width: 380px; margin: 30px auto; display: grid; gap: 12px; }
  .av-login h1 { font-size: 1.4rem; margin: 0; }
  .av-login input { width: 100%; }
  .av-login .err { color: #b42318; min-height: 1.2em; margin: 0; font-size: .9rem; }
  .av-out { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 12px; font: inherit; cursor: pointer; color: var(--ink); }
  .icon { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font: inherit; color: var(--ink); }
</style>
</head>
<body>
<div class="av-wrap">
  <div class="av-top"><img src="/media/logo-letters.png" alt="La Belle Vie" width="49" height="34"><span id="note">הדף שלך אצלנו. רק אתה רואה אותו.</span>
    <span class="ar-lang" role="group" aria-label="שפה / Langue"><button type="button" data-lang="he">עברית</button><button type="button" data-lang="fr" lang="fr">Français</button></span>
    <span><button type="button" class="av-out" id="pw" hidden>החלפת סיסמה</button> <button type="button" class="av-out" id="out" hidden>יציאה</button></span></div>
  <main id="root" class="ar" aria-live="polite"><p class="av-msg">טוען…</p></main>
</div>
<script type="module">
  import { drawArtist } from '/admin/artists.js';
  const root = document.getElementById('root');
  // the link is /artist/#<id>.<token> (after the #, so it never reaches server logs)
  const [id, t] = location.hash.slice(1).split('.');
  const qs = new URLSearchParams(location.search), demo = qs.has('demo');
  let lang = qs.get('lang') === 'fr' ? 'fr' : 'he', artist = null;
  const FR_ERR = 'Ce lien n’est pas valide ou a expiré. Demandez un nouveau lien à La Belle Vie.';
  function paint() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'fr' ? 'ltr' : 'rtl';
    document.getElementById('note').textContent = lang === 'fr' ? 'Votre page chez nous. Vous seul la voyez.' : 'הדף שלך אצלנו. רק אתה רואה אותו.';
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (!artist && root.querySelector('.av-msg')) root.querySelector('.av-msg').textContent = lang === 'fr' ? 'Chargement…' : 'טוען…';
    if (artist) { document.title = (lang === 'fr' && artist.nameFr ? artist.nameFr : artist.name) + ' – La Belle Vie'; drawArtist(root, artist, { sample: demo, lang }); }
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; qs.set('lang', lang); history.replaceState(null, '', '?' + qs + location.hash); paint(); }));
  // with a private link (#id.token) → that page; without → the artist's own login (cookie from /api/login)
  const byLink = !!(id && t), out = document.getElementById('out');
  const L = () => lang === 'fr'
    ? { h: 'Connexion', u: 'Nom d’utilisateur', p: 'Mot de passe', b: 'Se connecter', e: 'Nom d’utilisateur ou mot de passe incorrect.', many: 'Trop d’essais. Réessayez dans 15 minutes.', out: 'Déconnexion',
        pw: 'Changer le mot de passe', old: 'Mot de passe actuel', nw: 'Nouveau mot de passe (8 caractères minimum)', save: 'Enregistrer', cancel: 'Annuler', ok: 'Mot de passe changé.', badOld: 'Le mot de passe actuel est incorrect.', short: 'Le nouveau mot de passe doit avoir au moins 8 caractères.' }
    : { h: 'כניסה לדף שלך', u: 'שם משתמש', p: 'סיסמה', b: 'כניסה', e: 'שם המשתמש או הסיסמה לא נכונים.', many: 'יותר מדי ניסיונות. נסו שוב בעוד 15 דקות.', out: 'יציאה',
        pw: 'החלפת סיסמה', old: 'הסיסמה הנוכחית', nw: 'סיסמה חדשה (8 תווים לפחות)', save: 'שמירה', cancel: 'ביטול', ok: 'הסיסמה הוחלפה.', badOld: 'הסיסמה הנוכחית לא נכונה.', short: 'הסיסמה החדשה צריכה 8 תווים לפחות.' };
  const pwBtn = document.getElementById('pw');
  let must = false;
  pwBtn.addEventListener('click', () => pwForm());
  function pwForm() {
    if (root.querySelector('.av-pw')) return;
    const l = L(), f = document.createElement('form');
    f.className = 'card av-login av-pw';
    f.innerHTML = `<h1>${l.pw}</h1><label class="f">${l.old}<input name="old" type="password" dir="ltr" autocomplete="current-password" required></label>
      <label class="f">${l.nw}<input name="nw" type="password" dir="ltr" autocomplete="new-password" minlength="8" required></label>
      <p class="err" role="alert"></p><button class="btn btn--gold" type="submit">${l.save}</button>${must ? '' : `<button class="av-out" type="button" data-c>${l.cancel}</button>`}`;
    if (must) { root.innerHTML = ''; f.insertAdjacentHTML('afterbegin', `<p>${lang === 'fr' ? 'Première connexion : choisissez votre propre mot de passe pour ouvrir votre page.' : 'כניסה ראשונה: בחרו סיסמה משלכם, ואז הדף שלכם נפתח.'}</p>`); }
    root.prepend(f); f.old.focus();
    f.querySelector('[data-c]')?.addEventListener('click', () => f.remove());
    f.addEventListener('submit', async e => {
      e.preventDefault(); const err = f.querySelector('.err'); err.textContent = '';
      if (f.nw.value.length < 8) { err.textContent = L().short; return; }
      const r = await fetch('/api/artists?me=1', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ old: f.old.value, password: f.nw.value }) });
      if (r.ok) { if (must) { must = false; return load(); } f.innerHTML = `<p>${L().ok}</p>`; setTimeout(() => f.remove(), 2500); return; }
      err.textContent = r.status === 403 ? L().badOld : r.status === 401 ? L().e : L().short;
    });
  }
  function loginForm() {
    const l = L();
    root.innerHTML = `<form class="card av-login"><h1>${l.h}</h1>
      <label class="f">${l.u}<input name="username" dir="ltr" autocomplete="username" required></label>
      <label class="f">${l.p}<input name="password" type="password" dir="ltr" autocomplete="current-password" required></label>
      <p class="err" role="alert"></p><button class="btn btn--gold" type="submit">${l.b}</button></form>`;
    root.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, err = f.querySelector('.err'); err.textContent = '';
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: f.username.value.trim(), password: f.password.value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.artist) return load();
      if (r.ok && j.user) { location.href = '/admin/'; return; }   // a manager logged in here by mistake
      err.textContent = r.status === 429 ? L().many : L().e;
    });
  }
  async function load() {
    const r = await fetch(byLink ? `/api/artists?view=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}` : '/api/artists?me=1', { cache: 'no-store' });
    if (!r.ok) {
      if (!byLink && r.status === 401) { artist = null; out.hidden = true; return loginForm(); }
      root.innerHTML = '<p class="av-msg"></p>'; root.firstChild.textContent = lang === 'fr' ? FR_ERR : 'הקישור לא תקין או שפג תוקפו. בקשו מ-La Belle Vie קישור חדש.';
      return;
    }
    const j = await r.json();
    must = !byLink && !!j.must;
    out.hidden = byLink; out.textContent = L().out; pwBtn.hidden = byLink || must; pwBtn.textContent = L().pw;
    if (must) return pwForm();
    artist = j.artist;
    paint();
  }
  out.addEventListener('click', async () => { await fetch('/api/artists?me=1', { method: 'DELETE' }); artist = null; out.hidden = true; pwBtn.hidden = true; loginForm(); });
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { out.textContent = L().out; pwBtn.textContent = L().pw; if (!artist && root.querySelector('.av-login')) loginForm(); }));
  paint();
  load().catch(() => { root.innerHTML = '<p class="av-msg"></p>'; root.firstChild.textContent = lang === 'fr' ? 'Erreur de connexion. Réessayez.' : 'בעיית חיבור. נסו שוב.'; });
</script>
</body>
</html>
