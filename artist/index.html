<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="only light">
<title>הדף שלי – La Belle Vie</title>
<link rel="icon" type="image/png" href="/media/icon-gold.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/events.css">
<link rel="stylesheet" href="/admin/artists.css">
<style>
  body { min-height: 100vh; }
  .av-wrap { width: min(1120px, 100%); margin: 0 auto; padding: 18px 16px 48px; }
  .av-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--ink-2); font-size: .88rem; }
  .av-top img { height: 34px; width: auto; }
  .av-msg { padding: 40px 20px; text-align: center; color: var(--ink-2); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .card__head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card__head h2 { font-size: 1.25rem; }
  .card__head p { margin: 2px 0 0; color: var(--ink-2); font-size: .88rem; }
  .icon { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font: inherit; color: var(--ink); }
</style>
</head>
<body>
<div class="av-wrap">
  <div class="av-top"><img src="/media/logo-letters.png" alt="La Belle Vie" width="49" height="34"><span>הדף שלך אצלנו. רק אתה רואה אותו.</span></div>
  <main id="root" class="ar" aria-live="polite"><p class="av-msg">טוען…</p></main>
</div>
<script type="module">
  import { drawArtist } from '/admin/artists.js';
  const root = document.getElementById('root');
  // the link is /artist/#<id>.<token> (after the #, so it never reaches server logs)
  const [id, t] = location.hash.slice(1).split('.');
  const demo = new URLSearchParams(location.search).has('demo');
  try {
    const r = await fetch(`/api/artists?view=${encodeURIComponent(id || '')}&t=${encodeURIComponent(t || '')}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const { artist } = await r.json();
    document.title = artist.name + ' – La Belle Vie';
    drawArtist(root, artist, { sample: demo });
  } catch (e) {
    root.innerHTML = '<p class="av-msg">הקישור לא תקין או שפג תוקפו. בקשו מ-La Belle Vie קישור חדש.</p>';
  }
</script>
</body>
</html>
